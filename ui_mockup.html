<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>風鈴 UI 示意</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(160deg, #f5f0ff 0%, #ede4f7 40%, #e8dff0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Canvas 光球系統 - 置於卡片上方 */
  #orbCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .glass-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    height: 100%;
    max-height: 100vh;
    max-height: 100dvh;
    padding: 28px 24px;
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.55);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 12px 48px rgba(160, 120, 200, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }

  .template-info {
    text-align: center;
    margin-bottom: 24px;
  }

  .template-name {
    font-size: 1.2rem;
    font-weight: 600;
    color: #4a3f55;
    margin-bottom: 4px;
  }

  .template-desc {
    font-size: 0.85rem;
    color: #7a6b8a;
  }

  .play-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 27px;
    background: linear-gradient(135deg, #6ee7b7, #34d399);
    color: white;
    font-size: 1.15rem;
    font-weight: 600;
    cursor: pointer;
    margin: 24px 0;
    box-shadow: 0 4px 16px rgba(52, 211, 153, 0.35);
    transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.12s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.15s;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .play-btn.pop {
    transform: scale(1.06);
    box-shadow: 0 8px 28px rgba(52, 211, 153, 0.55);
    background: linear-gradient(135deg, #5dd9a8, #28c78a);
  }

  /* 水波紋效果 */
  .play-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    transform: scale(0);
    animation: rippleAnim 0.55s ease-out forwards;
    pointer-events: none;
  }

  @keyframes rippleAnim {
    to {
      transform: scale(2.5);
      opacity: 0;
    }
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .control-row.two-col {
    justify-content: space-between;
  }

  .control-item {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .control-item.half {
    flex: 0 0 calc(50% - 6px);
  }

  .control-label {
    font-size: 0.95rem;
    color: #6b5b7a;
    white-space: nowrap;
    min-width: 48px;
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }

  input[type="range"] {
    flex: 1;
    height: 8px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(200, 180, 230, 0.4);
    border-radius: 4px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 2px 8px rgba(150, 100, 200, 0.3);
    cursor: pointer;
  }

  .value-tag {
    font-size: 0.75rem;
    color: #8b7a9e;
    min-width: 36px;
    text-align: right;
  }

  .selector-row {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .selector-row.horizontal {
    flex-direction: row;
    align-items: center;
  }

  .selector-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .selector-label {
    font-size: 0.95rem;
    color: #6b5b7a;
    min-width: 40px;
  }

  select {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    background: rgba(255,255,255,0.2);
    color: #4a3f55;
    font-size: 0.85rem;
    outline: none;
  }

  .hint-text {
    text-align: center;
    font-size: 0.75rem;
    color: rgba(150, 120, 180, 0.7);
    margin-top: 12px;
  }

  @media (orientation: portrait) {
    body { align-items: center; justify-content: center; }
    .glass-card {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 100vh;
      max-height: 100dvh;
    }
  }

  @media (orientation: landscape) {
    body { align-items: stretch; justify-content: center; }
    .glass-card {
      height: 100%;
      max-height: 100%;
      width: auto;
      max-width: 100vw;
    }
  }

  @media (min-width: 768px) {
    body { align-items: center; justify-content: center; }
    .glass-card {
      width: 100%;
      max-width: 420px;
      height: auto;
      max-height: 95vh;
      border-radius: 24px;
    }
  }
</style>
</head>
<body>

<canvas id="orbCanvas"></canvas>

<div class="glass-card" id="card">
  <div class="template-info">
    <div class="template-name">🌸 日本禪風</div>
    <div class="template-desc">D Major Pentatonic &bull; 禪風</div>
  </div>

  <button class="play-btn" id="playBtn">▶ 開始</button>

  <div class="controls">
    <!-- 第一行：音量（單獨） -->
    <div class="control-row">
      <span class="control-label">音量</span>
      <div class="slider-group">
        <input type="range" id="volume" min="0" max="100" value="75">
        <span class="value-tag" id="volumeVal">75%</span>
      </div>
    </div>

    <!-- 第二行：速度 + 殘響（並列） -->
    <div class="control-row two-col" style="gap:16px;">
      <div class="control-item half" style="flex:1;">
        <span class="control-label">速度</span>
        <div class="slider-group">
          <input type="range" id="tempo" min="40" max="180" value="72">
          <span class="value-tag" id="tempoVal">72 BPM</span>
        </div>
      </div>
      <div class="control-item half" style="flex:1;">
        <span class="control-label">殘響</span>
        <div class="slider-group">
          <input type="range" id="reverb" min="0" max="100" value="40">
          <span class="value-tag" id="reverbVal">40%</span>
        </div>
      </div>
    </div>
  </div>

  <div class="selector-row horizontal" style="gap:10px;">
    <div class="selector-item" style="flex:2;">
      <span class="selector-label">模板</span>
      <select id="templateSelect" style="width:100%;">
        <option value="preset">🌸 日本禪風</option>
        <option value="preset">🎷 Jazz Ambient</option>
        <option value="preset">🌌 新世紀宇宙</option>
        <option value="preset">🌻 鄉村花園</option>
        <option value="preset">🏛️ 古典室內樂</option>
        <option value="custom">📁 自訂模板...</option>
      </select>
    </div>
    <div class="selector-item" style="flex:1;">
      <span class="selector-label">音色</span>
      <select style="min-width:0; width:100%;">
        <option>🎵 金屬</option>
        <option>🔮 玻璃</option>
        <option>🏺 陶磁</option>
        <option>🪵 木質</option>
      </select>
    </div>
  </div>
  <div class="selector-item" id="customFileRow">
      <span class="selector-label">自訂</span>
      <input type="file" id="customFile" accept=".json" disabled style="
        flex:1; width:100%; padding:8px 12px; border:1px solid rgba(255,255,255,0.15);
        border-radius:12px; background:rgba(0,0,0,0.08);
        color:#999; font-size:0.85rem; outline:none; cursor:not-allowed;">
  </div>


</div>

<script>
// ─────────────────────────────────────────────
//  光球粒子系統（Canvas 2D）
// ─────────────────────────────────────────────
const canvas = document.getElementById('orbCanvas');
const ctx = canvas.getContext('2d');
let orbs = [];
let animationId = null;

// 設置 Canvas 尺寸
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 光球上限（效能保護）
const MAX_ORBS = 40;

// 光球顏色池（淡色系：鵝黃、淡藍、粉紅、粉紫）
const orbColors = [
  'rgba(255, 248, 200,',  // 鵝黃
  'rgba(200, 235, 255,',  // 淡藍
  'rgba(255, 210, 220,',  // 粉紅
  'rgba(230, 200, 255,',  // 粉紫
  'rgba(255, 225, 200,',  // 杏桃
  'rgba(210, 240, 230,',  // 薄荷綠
  'rgba(255, 220, 240,',  // 淺玫瑰
  'rgba(220, 220, 255,',  // 淡紫羅蘭
];

// 建立一顆光球
function createOrb(x, y) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.4 + Math.random() * 1.2;
  return {
    x: x,
    y: y,
    baseRadius: 8 + Math.random() * 7,        // 初始半徑 8-15px
    maxRadius: 15 + Math.random() * 35,       // 擴散半徑 15-50px
    opacity: 0.6 + Math.random() * 0.3,       // 初始透明度 0.6-0.9
    lifespan: 2000 + Math.random() * 2000,     // 生命週期 2-4秒
    born: Date.now(),
    color: orbColors[Math.floor(Math.random() * orbColors.length)],
    vx: Math.cos(angle) * speed,              // 水平飄動
    vy: Math.sin(angle) * speed,              // 垂直飄動
    driftAngle: Math.random() * Math.PI * 2,   // 飄動方向
    driftSpeed: 0.005 + Math.random() * 0.015, // 飄動速度
  };
}

// 根據點擊位置建立多顆光球（超過上限時移除最舊的）
function spawnOrbs(x, y, count = 5) {
  for (let i = 0; i < count; i++) {
    const offsetX = (Math.random() - 0.5) * 60;
    const offsetY = (Math.random() - 0.5) * 60;
    orbs.push(createOrb(x + offsetX, y + offsetY));
  }
  // 超過上限時，移除最舊的光球
  if (orbs.length > MAX_ORBS) {
    orbs = orbs.slice(orbs.length - MAX_ORBS);
  }
  if (!animationId) animate();
}

// 繪製單顆光球（無 blur 版本：純徑向漸層產生光暈）
function drawOrb(orb) {
  const age = Date.now() - orb.born;
  const life = Math.min(age / orb.lifespan, 1);  // 0→1

  // 半徑從 base → max 再維持
  let radius;
  if (life < 0.3) {
    radius = orb.baseRadius + (orb.maxRadius - orb.baseRadius) * (life / 0.3);
  } else {
    radius = orb.maxRadius;
  }

  // 透明度淡出
  let opacity = orb.opacity;
  if (life > 0.6) {
    opacity = orb.opacity * (1 - (life - 0.6) / 0.4);
  }

  // 位置飄動
  orb.driftAngle += orb.driftSpeed;
  orb.x += orb.vx + Math.cos(orb.driftAngle) * 0.3;
  orb.y += orb.vy + Math.sin(orb.driftAngle) * 0.3;

  // 繪製：徑向漸層產生光暈（無需 blur）
  // 外圈：大範圍淡出（光暈本體）
  const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, radius);
  grad.addColorStop(0, orb.color + opacity + ')');
  grad.addColorStop(0.4, orb.color + (opacity * 0.5) + ')');
  grad.addColorStop(1, orb.color + '0)');

  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.arc(orb.x, orb.y, radius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // 核心亮點（徑向漸層的中心本身就是亮的，不需要額外繪製）
}

// 動畫迴圈
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const now = Date.now();
  orbs = orbs.filter(o => now - o.born < o.lifespan);

  for (const orb of orbs) {
    drawOrb(orb);
  }

  if (orbs.length > 0) {
    animationId = requestAnimationFrame(animate);
  } else {
    animationId = null;
  }
}

// ─────────────────────────────────────────────
//  儲存觸控起點（判斷是否為點擊，而非拖曳）
// ─────────────────────────────────────────────
let touchStartPos = null;

document.addEventListener('touchstart', e => {
  // 只在 canvas 或 card 內部記錄起點
  const tag = e.target.tagName.toUpperCase();
  if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'BUTTON') {
    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!touchStartPos) return;
  const dx = Math.abs(e.changedTouches[0].clientX - touchStartPos.x);
  const dy = Math.abs(e.changedTouches[0].clientY - touchStartPos.y);
  touchStartPos = null;

  // 拖曳太遠就不触发（threshold: 15px）
  if (dx > 15 || dy > 15) return;

  const tag = e.target.tagName.toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON') return;

  const rect = canvas.getBoundingClientRect();
  const x = e.changedTouches[0].clientX - rect.left;
  const y = e.changedTouches[0].clientY - rect.top;

  const count = 4 + Math.floor(Math.random() * 4);
  spawnOrbs(x, y, count);
}, { passive: true });

document.addEventListener('touchcancel', () => {
  touchStartPos = null;
});

// ─────────────────────────────────────────────
//  滑桿 / 選單 / 按鈕保證正常（不做任何 prevent）
// ─────────────────────────────────────────────

// 電腦：滑鼠放開（mouseup）才釋出
document.addEventListener('mouseup', e => {
  const tag = e.target.tagName.toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON') return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const count = 4 + Math.floor(Math.random() * 4);
  spawnOrbs(x, y, count);
});

// ─────────────────────────────────────────────
//  按鈕：按下放大、釋放縮小+光球
// ─────────────────────────────────────────────
const playBtn = document.getElementById('playBtn');

// 按下 → 立即放大 + 水波紋（出現在點擊位置）
function handleBtnDown(e) {
  e.stopPropagation();
  playBtn.classList.add('pop');

  // 水波紋（出現在實際點擊位置）
  let cx, cy;
  if (e.touches && e.touches.length > 0) {
    cx = e.touches[0].clientX - playBtn.getBoundingClientRect().left;
    cy = e.touches[0].clientY - playBtn.getBoundingClientRect().top;
  } else {
    cx = e.clientX - playBtn.getBoundingClientRect().left;
    cy = e.clientY - playBtn.getBoundingClientRect().top;
  }
  const ripple = document.createElement('span');
  ripple.classList.add('ripple');
  ripple.style.left = (cx - 20) + 'px';
  ripple.style.top = (cy - 20) + 'px';
  ripple.style.width = ripple.style.height = '40px';
  playBtn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// 釋放 → 縮小回 + 光球
function handleBtnUp(e) {
  e.stopPropagation();
  playBtn.classList.remove('pop');

  const rect = canvas.getBoundingClientRect();
  const btnRect = playBtn.getBoundingClientRect();
  const cx = (btnRect.left + btnRect.width / 2) - rect.left;
  const cy = (btnRect.top + btnRect.height / 2) - rect.top;

  // 放射狀光球
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const ox = Math.cos(angle) * 20;
    const oy = Math.sin(angle) * 20;
    const o = createOrb(cx + ox, cy + oy);
    o.vx = Math.cos(angle) * 2;
    o.vy = Math.sin(angle) * 2;
    orbs.push(o);
  }
  if (!animationId) animate();
}

// 電腦
playBtn.addEventListener('mousedown', handleBtnDown);
playBtn.addEventListener('mouseup', handleBtnUp);
// 避免按鈕範圍外放開時漏掉（document 等級彌補）
document.addEventListener('mouseup', e => {
  if (e.target !== playBtn) {
    playBtn.classList.remove('pop');
  }
});

// 手機
playBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  e.stopPropagation();
  handleBtnDown(e);
}, { passive: false });
playBtn.addEventListener('touchend', e => {
  e.preventDefault();
  e.stopPropagation();
  handleBtnUp(e);
}, { passive: false });
// 防止 touchcancel 也讓按鈕狀態殘留
playBtn.addEventListener('touchcancel', () => {
  playBtn.classList.remove('pop');
});

// ─────────────────────────────────────────────
//  UI 互動（原本的邏輯）
// ─────────────────────────────────────────────
document.getElementById('templateSelect').addEventListener('change', e => {
  const fileInput = document.getElementById('customFile');
  const isCustom = e.target.value === 'custom';
  fileInput.disabled = !isCustom;
  fileInput.style.background = isCustom ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.08)';
  fileInput.style.borderColor = isCustom ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.15)';
  fileInput.style.color = isCustom ? '#4a3f55' : '#999';
  fileInput.style.cursor = isCustom ? 'pointer' : 'not-allowed';
});

document.getElementById('volume').addEventListener('input', e => {
  document.getElementById('volumeVal').textContent = e.target.value + '%';
});
document.getElementById('tempo').addEventListener('input', e => {
  document.getElementById('tempoVal').textContent = e.target.value + ' BPM';
});
document.getElementById('reverb').addEventListener('input', e => {
  document.getElementById('reverbVal').textContent = e.target.value + '%';
});
</script>

</body>
</html>
