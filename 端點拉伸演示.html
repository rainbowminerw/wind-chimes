<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端點拉伸加成演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { font-weight: 300; font-size: 1.6rem; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
  .container {
    background: #16213e;
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #0f0f1a;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .ctrl-row label {
    font-size: 0.9rem;
    min-width: 70px;
    color: #aaa;
  }
  .ctrl-row input[type="range"] {
    flex: 1;
    min-width: 120px;
    accent-color: #e94560;
    height: 6px;
    cursor: pointer;
  }
  .ctrl-row .val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    background: #0f0f1a;
    padding: 2px 10px;
    border-radius: 6px;
    min-width: 44px;
    text-align: center;
    color: #e94560;
  }
  .presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .presets button {
    background: #2a2a4a;
    color: #ccc;
    border: 1px solid #3a3a5a;
    padding: 5px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.15s;
  }
  .presets button:hover {
    background: #e94560;
    border-color: #e94560;
    color: #fff;
  }
  .presets button.active {
    background: #e94560;
    border-color: #e94560;
    color: #fff;
  }
  .info {
    display: flex;
    gap: 20px;
    margin-top: 8px;
    font-size: 0.8rem;
    color: #777;
  }
  .info span { color: #aaa; }
  .mode-hint {
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(233, 69, 96, 0.08);
    border-left: 3px solid #e94560;
    border-radius: 6px;
    font-size: 0.8rem;
    color: #bbb;
  }
</style>
</head>
<body>
  <h1>端點拉伸加成</h1>
  <div class="subtitle">將等間距數值經非線性變換推向區間兩端（或擠向中間）· p 控制強度與方向</div>

  <div class="container">
    <canvas id="canvas" width="840" height="400"></canvas>

    <div class="controls">
      <div class="ctrl-row">
        <label>強度 p</label>
        <input type="range" id="pSlider" min="-5" max="5" step="0.05" value="2">
        <span class="val" id="pVal">2.00</span>
      </div>
      <div class="ctrl-row">
        <label>方法</label>
        <div class="presets" id="methodGroup">
          <button data-method="vshape" class="active">V 形拉伸</button>
          <button data-method="power">冪律偏移</button>
          <button data-method="sigmoid">反 Sigmoid</button>
        </div>
      </div>
      <div class="ctrl-row">
        <label>預設 p</label>
        <div class="presets">
          <button data-p="-3.0">p=-3（往中）</button>
          <button data-p="-1.0">p=-1</button>
          <button data-p="0.0">p=0（不變）</button>
          <button data-p="1.0">p=1</button>
          <button data-p="2.0" class="active">p=2（推薦）</button>
          <button data-p="5.0">p=5（極端）</button>
        </div>
      </div>
      <div class="info">
        <div>等距點數：<span>20</span></div>
        <div>效果：<span id="effectLabel">↗ 往兩端拉伸</span></div>
      </div>
      <div class="mode-hint" id="modeHint">
        <strong>p &gt; 1</strong> 往兩端拉伸（離散）&nbsp;&nbsp;|&nbsp;&nbsp;
        <strong>p = 1</strong> 保持不變（線性）&nbsp;&nbsp;|&nbsp;&nbsp;
        <strong>0 &lt; p &lt; 1</strong> 往兩端弱拉伸&nbsp;&nbsp;|&nbsp;&nbsp;
        <strong>p = 0</strong> 所有值集中到 0.5&nbsp;&nbsp;|&nbsp;&nbsp;
        <strong>p &lt; 0</strong> 往中間擠壓（集中）
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pSlider = document.getElementById('pSlider');
    const pVal = document.getElementById('pVal');

    const W = 840, H = 400;
    const pad = { top: 36, bottom: 36, left: 56, right: 28 };
    const plotW = W - pad.left - pad.right;
    const plotH = H - pad.top - pad.bottom;

    let method = 'vshape';
    let p = 2.0;

    // === 核心：將 p 轉為有效指數 ===
    // 為了保持數學對稱性，我們做一個邏輯轉換：
    // p = 0  → 全部回到 0.5（不動點）
    // p > 0  → 往兩端拉伸（越大越極端）
    // p < 0  → 往中間擠壓（越小越極端）
    // 實際使用時，內部用 abs(p) 做拉伸，但對 p<0 時將方向反轉

    function effectiveTransform(t, p) {
      // 取得拉伸強度（總是 >= 0）
      const absP = Math.abs(p);
      // 針對型態：p=0 時全部回到不動點
      if (absP < 1e-10) return 0.5;
      // 真正的指數：用 log 定義，讓 p=1 時線性不變
      // 我們用 exp(log(...) * absP) 確保 p 從 0→1 平滑過渡
      const ep = Math.max(absP, 1e-10);
      return ep;
    }

    function transform_vshape(t, p) {
      const absP = Math.abs(p);
      if (absP < 1e-10) return 0.5;
      // p > 0 往兩端，p < 0 往中間
      const exponent = absP;
      if (p >= 0) {
        if (t < 0.5) return 0.5 * Math.pow(2 * t, exponent);
        else return 1 - 0.5 * Math.pow(2 * (1 - t), exponent);
      } else {
        // p < 0：反轉方向 — 中間高兩端低
        const half = Math.pow(0.5, exponent);
        if (t < 0.5) return 0.5 - half + Math.pow(t, exponent);
        else return 0.5 + half - Math.pow(1 - t, exponent);
      }
    }

    function transform_power(t, p) {
      const absP = Math.abs(p);
      if (absP < 1e-10) return 0.5;
      const exponent = absP;
      const offset = (t - 0.5) * Math.pow(Math.abs(2 * t - 1), exponent);
      if (p >= 0) return 0.5 + offset;
      else return 0.5 - offset;
    }

    function transform_sigmoid(t, p) {
      // 反 sigmoid 用 k = |p|*3
      const absP = Math.abs(p);
      if (absP < 1e-10) return 0.5;
      const k = absP * 3;
      const s = 1 / (1 + Math.exp(-k * (t - 0.5)));
      const s0 = 1 / (1 + Math.exp(-k * -0.5));
      const s1 = 1 / (1 + Math.exp(-k * 0.5));
      const mapped = (s - s0) / (s1 - s0);
      if (p >= 0) return mapped;
      else return 1 - mapped;
    }

    function transform(t, method, p) {
      switch (method) {
        case 'vshape':  return transform_vshape(t, p);
        case 'power':   return transform_power(t, p);
        case 'sigmoid': return transform_sigmoid(t, p);
        default: return t;
      }
    }

    // === 繪圖 ===
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 標題 — 動態效果提示
      const effectText = p > 0.01 ? '↗ 往兩端拉伸'
        : p < -0.01 ? '↙ 往中間擠壓'
        : '— 全部集中到 0.5（不變）';
      document.getElementById('effectLabel').textContent = effectText;

      ctx.fillStyle = '#666';
      ctx.font = '13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      const modeStr = p > 1 ? '（離散化）' : (p < -1 ? '（集中化）' : '');
      ctx.fillText(`p = ${p.toFixed(2)} ${modeStr}`, W / 2, 16);

      // Y 軸標籤
      ctx.fillStyle = '#555';
      ctx.font = '11px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('1.0', pad.left - 8, pad.top - 2);
      ctx.fillText('0.5', pad.left - 8, pad.top + plotH / 2 + 4);
      ctx.fillText('0.0', pad.left - 8, pad.top + plotH + 4);

      // 網格線
      ctx.strokeStyle = '#2a2a3a';
      ctx.lineWidth = 1;
      for (let yf of [0, 0.25, 0.5, 0.75, 1]) {
        const y = pad.top + plotH * (1 - yf);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(W - pad.right, y);
        ctx.stroke();
      }

      const N = 20;
      const original = [];
      const transformed = [];

      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        original.push(t);
        transformed.push(transform(t, method, p));
      }

      // 連接線（變換後）
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(233, 69, 96, 0.25)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < N; i++) {
        const x = pad.left + transformed[i] * plotW;
        const y = pad.top + plotH * (1 - original[i]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // 輔助線（灰色到紅色）
      for (let i = 0; i < N; i++) {
        const t = original[i];
        const x0 = pad.left + t * plotW;
        const x1 = pad.left + transformed[i] * plotW;
        const y = pad.top + plotH * (1 - t);

        ctx.beginPath();
        const diff = transformed[i] - t;
        if (Math.abs(diff) < 1e-8) {
          ctx.strokeStyle = 'rgba(233, 69, 96, 0.35)';
          ctx.setLineDash([3, 4]);
          ctx.lineWidth = 1;
          ctx.moveTo(x0 - 6, y);
          ctx.lineTo(x0 + 6, y);
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          ctx.strokeStyle = diff > 0 ? 'rgba(79, 195, 247, 0.12)' : 'rgba(255, 200, 50, 0.12)';
          ctx.lineWidth = 1;
          ctx.moveTo(x0, y);
          ctx.lineTo(x1, y);
          ctx.stroke();
        }
      }

      // 原始點（灰色）
      for (let i = 0; i < N; i++) {
        const t = original[i];
        const x = pad.left + t * plotW;
        const y = pad.top + plotH * (1 - t);
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#666';
        ctx.fill();
      }

      // 變換後點（紅色）
      for (let i = 0; i < N; i++) {
        const t = original[i];
        const x = pad.left + transformed[i] * plotW;
        const y = pad.top + plotH * (1 - t);

        ctx.beginPath();
        ctx.arc(x, y, 7, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(233, 69, 96, 0.15)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#e94560';
        ctx.fill();
      }

      // 不變點提示
      const fixed = 0.5;
      const fx = pad.left + transform(fixed, method, p) * plotW;
      const fy = pad.top + plotH * (1 - fixed);
      ctx.beginPath();
      ctx.arc(fx, fy, 5, 0, Math.PI * 2);
      ctx.strokeStyle = '#4fc3f7';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#4fc3f7';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('不變點', fx + 10, fy + 4);

      // 底部標籤
      ctx.fillStyle = '#555';
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('0', pad.left, pad.top + plotH + 22);
      ctx.fillText('0.5', pad.left + plotW * 0.5, pad.top + plotH + 22);
      ctx.fillText('1', pad.left + plotW, pad.top + plotH + 22);
    }

    // === 事件綁定 ===
    pSlider.addEventListener('input', () => {
      p = parseFloat(pSlider.value);
      pVal.textContent = p.toFixed(2);
      // 更新預設 p 按鈕高亮
      document.querySelectorAll('[data-p]').forEach(btn => {
        const bp = parseFloat(btn.dataset.p);
        btn.classList.toggle('active', Math.abs(bp - p) < 0.01);
      });
      draw();
    });

    // 方法切換
    document.querySelectorAll('#methodGroup button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#methodGroup button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        method = btn.dataset.method;
        draw();
      });
    });

    // 預設 p 值
    document.querySelectorAll('[data-p]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-p]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        p = parseFloat(btn.dataset.p);
        pSlider.value = p;
        pVal.textContent = p.toFixed(2);
        draw();
      });
    });

    // 初始繪製
    draw();
  </script>
</body>
</html>
